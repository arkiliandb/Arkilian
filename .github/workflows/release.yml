name: release

# Builds tagged-release artifacts on Linux, macOS, and Windows across all
# language bindings (Node.js, Python, Rust, Go, PHP, C Core), attaches them
# to the GitHub release, and publishes supply-chain evidence:
#
#   * SLSA provenance — slsa-github-generator (GitHub OIDC)
#   * SBOM — Syft-generated SPDX document, signed with sigstore keyless
#   * SHA256SUMS.txt — cryptographic checksums covering all release assets

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.1 — defaults to package.json version)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  # ── Resolve Release Tag & Version ──────────────────────────────────
  resolve_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - id: resolve
      run: |
        TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "prod" ]]; then
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "Target Release Tag: $TAG"

  # ── Build the native C core assets for every platform ──────────────
  build_native:
    needs: [resolve_tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            artifact-dir: build
            shared-lib: libarkilian.so
            static-lib: libarkilian.a
            dlq-bin: arkilian-dlq
          - os: macos-15-intel
            suffix: darwin-x64
            artifact-dir: build
            shared-lib: libarkilian.dylib
            static-lib: libarkilian.a
            dlq-bin: arkilian-dlq
          - os: macos-latest
            suffix: darwin-arm64
            artifact-dir: build
            shared-lib: libarkilian.dylib
            static-lib: libarkilian.a
            dlq-bin: arkilian-dlq
          - os: windows-latest
            suffix: windows-x64
            artifact-dir: build/Release
            shared-lib: arkilian.dll
            static-lib: arkilian_static.lib
            dlq-bin: arkilian-dlq.exe
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev

    - name: Install Dependencies (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install curl
        echo "CMAKE_PREFIX_PATH=$(brew --prefix curl)" >> "$GITHUB_ENV"

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $vcpkgPath = "${{ runner.temp }}/vcpkg"
        git clone https://github.com/microsoft/vcpkg.git $vcpkgPath
        & "$vcpkgPath/bootstrap-vcpkg.bat"
        & "$vcpkgPath/vcpkg" install curl:x64-windows
        echo "VCPKG_ROOT=$vcpkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: pwsh

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DARKILIAN_BUILD_EXAMPLES=OFF -DARKILIAN_BUILD_TESTS=OFF
      shell: pwsh

    - name: Configure CMake (Unix)
      if: matrix.os != 'windows-latest'
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DARKILIAN_BUILD_EXAMPLES=OFF -DARKILIAN_BUILD_TESTS=OFF

    - name: Build
      run: cmake --build build --config Release -j4

    - name: Stage release package
      shell: bash
      run: |
        VERSION="${{ needs.resolve_tag.outputs.version }}"
        STAGE_DIR="$(mktemp -d /tmp/c-stage.XXXXXX 2>/dev/null || mktemp -d -t 'c-stage')"
        mkdir -p "$STAGE_DIR/include/arkilian" "$STAGE_DIR/lib" "$STAGE_DIR/bin" "dist"

        cp src/class.h src/hydration.h src/sha256.h "$STAGE_DIR/include/arkilian/"
        cp "${{ matrix.artifact-dir }}/${{ matrix.shared-lib }}" "$STAGE_DIR/lib/" 2>/dev/null || true
        cp "${{ matrix.artifact-dir }}/${{ matrix.static-lib }}" "$STAGE_DIR/lib/"
        cp "${{ matrix.artifact-dir }}/${{ matrix.dlq-bin }}" "$STAGE_DIR/bin/" 2>/dev/null || true

        # Copy standalone dlq binary for easy direct download
        if [ -f "${{ matrix.artifact-dir }}/${{ matrix.dlq-bin }}" ]; then
          EXT=""
          if [[ "${{ matrix.suffix }}" == *"windows"* ]]; then EXT=".exe"; fi
          cp "${{ matrix.artifact-dir }}/${{ matrix.dlq-bin }}" "dist/arkilian-dlq-v${VERSION}-${{ matrix.suffix }}${EXT}"
        fi

        # Create platform archive
        if [[ "${{ matrix.suffix }}" == *"windows"* ]]; then
          DEST_ZIP="$GITHUB_WORKSPACE/dist/arkilian-c-v${VERSION}-${{ matrix.suffix }}.zip"
          (cd "$STAGE_DIR" && 7z a "$DEST_ZIP" . || powershell -Command "Compress-Archive -Path (Get-ChildItem -Path .) -DestinationPath '$DEST_ZIP' -Force")
        else
          tar -czf "dist/arkilian-c-v${VERSION}-${{ matrix.suffix }}.tar.gz" -C "$STAGE_DIR" .
        fi

        # Also preserve raw shared lib for python wheel bundling in downstream jobs
        cp "${{ matrix.artifact-dir }}/${{ matrix.shared-lib }}" "dist/" 2>/dev/null || true

        rm -rf "$STAGE_DIR"
        ls -la dist/

    - name: Upload native assets
      uses: actions/upload-artifact@v4
      with:
        name: native-assets-${{ matrix.suffix }}
        path: dist/
        if-no-files-found: error

  # ── N-API prebuilt addons for Node.js ──────────────────────────────
  napi_prebuild:
    needs: [resolve_tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            libc: ""
          # glibc Linux arm64 (cross-compiled via gcc-aarch64-linux-gnu)
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            libc: ""
            cross: 1
          # musl Linux x64 (Alpine — Docker container with musl toolchain)
          - os: ubuntu-latest
            platform: linux
            arch: x64
            libc: musl
            container: alpine:3.20
          # macOS x64 (Intel)
          - os: macos-15-intel
            platform: darwin
            arch: x64
            libc: ""
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            platform: darwin
            arch: arm64
            libc: ""
          # Windows x64
          - os: windows-latest
            platform: win32
            arch: x64
            libc: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Install build deps (Linux glibc)
      if: matrix.platform == 'linux' && matrix.libc != 'musl'
      run: |
        if [ "${{ matrix.cross }}" = "1" ]; then
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Architectures: .*/Architectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources || true
            if ! grep -q "^Architectures:" /etc/apt/sources.list.d/ubuntu.sources; then
              sudo sed -i 's/^Suites:/Architectures: amd64\nSuites:/' /etc/apt/sources.list.d/ubuntu.sources
            fi
            CODENAME=$(lsb_release -cs)
            printf "Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: %s %s-updates %s-security\nComponents: main restricted universe multiverse\nArchitectures: arm64\n" "$CODENAME" "$CODENAME" "$CODENAME" | sudo tee /etc/apt/sources.list.d/arm64.sources
          else
            sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            CODENAME=$(lsb_release -cs)
            printf "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-security main restricted universe multiverse\n" "$CODENAME" "$CODENAME" "$CODENAME" | sudo tee -a /etc/apt/sources.list
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libcurl4-openssl-dev:arm64
        else
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
        fi

    - name: Install build deps (Alpine/musl)
      if: matrix.libc == 'musl'
      run: |
        apk add --no-cache curl-dev python3 make g++ nodejs npm bash

    - name: Install build deps (macOS)
      if: matrix.platform == 'darwin'
      run: |
        brew install curl
        echo "CMAKE_PREFIX_PATH=$(brew --prefix curl)" >> "$GITHUB_ENV"

    - name: Install build deps (Windows)
      if: matrix.platform == 'win32'
      run: |
        $vcpkgPath = "${{ runner.temp }}/vcpkg"
        git clone https://github.com/microsoft/vcpkg.git $vcpkgPath
        & "$vcpkgPath/bootstrap-vcpkg.bat"
        & "$vcpkgPath/vcpkg" install curl:x64-windows curl:x64-windows-static-md
        echo "VCPKG_ROOT=$vcpkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: pwsh

    - name: Setup Node (non-Alpine)
      if: matrix.libc != 'musl'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deps
      if: matrix.libc != 'musl'
      run: npm ci --ignore-scripts

    - name: Install deps (Alpine)
      if: matrix.libc == 'musl'
      run: npm ci --no-engine-strict --ignore-scripts

    - name: Cross-compile setup (Linux arm64)
      if: matrix.cross == 1
      run: |
        echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
        echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
        echo "STRIP=aarch64-linux-gnu-strip" >> "$GITHUB_ENV"
        sudo ln -sf /usr/bin/aarch64-linux-gnu-strip /usr/local/bin/strip
        echo "npm_config_arch=arm64" >> "$GITHUB_ENV"
        echo "CFLAGS=-I/usr/include/aarch64-linux-gnu" >> "$GITHUB_ENV"
        echo "CXXFLAGS=-I/usr/include/aarch64-linux-gnu" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

    - name: Build prebuild (Windows — cmake-js with vcpkg curl)
      if: matrix.platform == 'win32'
      shell: pwsh
      run: |
        npx cmake-js compile -a ${{ matrix.arch }} -T arkilian_napi `
          --CDCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
          --CDVCPKG_TARGET_TRIPLET=x64-windows-static-md `
          --CDARKILIAN_BUILD_NAPI=ON
        New-Item -ItemType Directory -Force -Path prebuilds/win32-x64 | Out-Null
        Copy-Item build/Release/arkilian.node prebuilds/win32-x64/node.napi.node

    - name: Build prebuild
      if: matrix.platform != 'win32'
      run: npx prebuildify --napi --strip --arch ${{ matrix.arch }}
      env:
        npm_config_arch: ${{ matrix.arch }}

    - name: Stage prebuild artifact
      shell: bash
      run: |
        if [ -n "${{ matrix.libc }}" ]; then
          mv prebuilds/${{ matrix.platform }}-${{ matrix.arch }} \
             prebuilds/${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.libc }}
        fi
        ls -laR prebuilds/

    - name: Upload prebuild
      uses: actions/upload-artifact@v4
      with:
        name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
        path: prebuilds/
        if-no-files-found: error

  # ── Build Language Bindings (Python, Rust, Go, PHP) ────────────────
  build_bindings:
    needs: [resolve_tag, build_native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            native-asset-name: native-assets-linux-x64
            shared-lib: libarkilian.so
          - os: macos-latest
            platform: darwin
            arch: arm64
            native-asset-name: native-assets-darwin-arm64
            shared-lib: libarkilian.dylib
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Download native shared library
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.native-asset-name }}
        path: native-lib-dl

    - name: Install dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev zip

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Python packages (wheel & sdist)
      run: |
        VERSION="${{ needs.resolve_tag.outputs.version }}"
        mkdir -p dist-bindings
        python -m pip install --upgrade pip build wheel setuptools cffi

        # Copy shared library into python package directory for self-contained wheel
        if [ -f "native-lib-dl/${{ matrix.shared-lib }}" ]; then
          cp "native-lib-dl/${{ matrix.shared-lib }}" bindings/python/arkilian/
        fi

        cd bindings/python
        python -m pip wheel --no-deps -w ../../dist-bindings .
        tar -czf "../../dist-bindings/arkilian-python-v${VERSION}.tar.gz" \
          --exclude='__pycache__' --exclude='*.egg-info' --exclude='dist' .
        rm -f arkilian/${{ matrix.shared-lib }}
        cd ../..

    - name: Build Rust crates & compiled libraries
      run: |
        VERSION="${{ needs.resolve_tag.outputs.version }}"
        # Package crates
        (cd bindings/rust/arkilian-sys && cargo package --allow-dirty --no-verify)
        if [ -f bindings/rust/arkilian-sys/target/package/arkilian-sys-*.crate ]; then
          cp bindings/rust/arkilian-sys/target/package/arkilian-sys-*.crate dist-bindings/arkilian-sys-v${VERSION}.crate
        fi

        (cd bindings/rust/arkilian && cargo package --allow-dirty --no-verify)
        if [ -f bindings/rust/arkilian/target/package/arkilian-*.crate ]; then
          cp bindings/rust/arkilian/target/package/arkilian-*.crate dist-bindings/arkilian-rust-v${VERSION}.crate
        fi

        # Precompiled Rust library archive
        mkdir -p build
        cp native-lib-dl/${{ matrix.shared-lib }} build/ 2>/dev/null || true
        (cd bindings/rust/arkilian && cargo build --release --lib)
        RUST_STAGE=$(mktemp -d)
        mkdir -p "$RUST_STAGE/lib" "$RUST_STAGE/include"
        cp bindings/rust/arkilian/src/bindings.h "$RUST_STAGE/include/" 2>/dev/null || true
        cp bindings/rust/arkilian/target/release/libarkilian.* "$RUST_STAGE/lib/" 2>/dev/null || true
        tar -czf "dist-bindings/arkilian-rust-lib-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C "$RUST_STAGE" .
        rm -rf "$RUST_STAGE"

    - name: Package Go & PHP bindings (Linux only to prevent duplicates)
      if: matrix.platform == 'linux'
      run: |
        VERSION="${{ needs.resolve_tag.outputs.version }}"
        tar -czf "dist-bindings/arkilian-go-v${VERSION}.tar.gz" -C bindings/go .
        tar -czf "dist-bindings/arkilian-php-v${VERSION}.tar.gz" -C bindings/php .
        (cd bindings/php && zip -r "../../dist-bindings/arkilian-php-v${VERSION}.zip" .)

    - name: Upload language binding artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bindings-${{ matrix.platform }}-${{ matrix.arch }}
        path: dist-bindings/
        if-no-files-found: error

  # ── Bundle npm package with all prebuilds ───────────────────────────
  publish_npm:
    needs: [resolve_tag, napi_prebuild]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Download all prebuilds
      uses: actions/download-artifact@v4
      with:
        pattern: prebuild-*
        path: prebuilds-collected
        merge-multiple: true

    - name: Merge prebuilds into package
      run: |
        rm -rf prebuilds
        mkdir -p prebuilds
        cp -r prebuilds-collected/* prebuilds/
        rm -rf prebuilds-collected
        find prebuilds/ -type f

    - name: Package standalone prebuilds archive
      run: |
        VERSION="${{ needs.resolve_tag.outputs.version }}"
        mkdir -p dist-npm
        tar -czf "dist-npm/arkilian-node-prebuilds-v${VERSION}.tar.gz" prebuilds/

    - name: Pack offline npm tarball (.tgz)
      run: |
        npm pack --pack-destination dist-npm/
        ls -la dist-npm/

    - name: Upload npm release assets
      uses: actions/upload-artifact@v4
      with:
        name: npm-release-assets
        path: dist-npm/
        if-no-files-found: error

    - name: Publish to npm (if NPM_TOKEN set)
      if: env.NODE_AUTH_TOKEN != ''
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Drop All Release Artifacts to GitHub Release ────────────────────
  drop_release_artifacts:
    needs: [resolve_tag, build_native, build_bindings, publish_npm]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-downloads

    - name: Aggregate release artifacts
      id: subjects
      run: |
        mkdir -p final-artifacts
        # Find all archives, packages, binaries, and checksums
        find all-downloads -type f \( \
          -name "*.tar.gz" -o \
          -name "*.tgz" -o \
          -name "*.zip" -o \
          -name "*.whl" -o \
          -name "*.crate" -o \
          -name "arkilian-dlq*" \
        \) -exec cp {} final-artifacts/ \;

        cd final-artifacts
        sha256sum * > SHA256SUMS.txt
        echo "=== SHA256 Checksums ==="
        cat SHA256SUMS.txt
        base64 -w0 SHA256SUMS.txt > ../subjects.sha256sum.base64
        echo "hashes=$(cat ../subjects.sha256sum.base64)" >> "$GITHUB_OUTPUT"
        cd ..

    - name: Generate SBOM (SPDX)
      uses: anchore/sbom-action@v0.24.0
      with:
        path: ./final-artifacts
        format: spdx-json
        output-file: arkilian.spdx.json

    - name: Sign SBOM with sigstore (keyless)
      uses: sigstore/cosign-installer@v4.1.0

    - name: cosign sign-blob
      run: |
        cosign sign-blob --yes \
          --output-signature arkilian.spdx.json.sig \
          --output-certificate arkilian.spdx.json.pem \
          arkilian.spdx.json
        cp arkilian.spdx.json arkilian.spdx.json.sig arkilian.spdx.json.pem final-artifacts/

    - name: Drop artifacts on GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ needs.resolve_tag.outputs.tag }}"
        echo "Target GitHub Release: $TAG"

        # Create the release if it does not exist yet
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "Arkilian $TAG" \
            --generate-notes
        fi

        echo "Attaching release artifacts to $TAG..."
        gh release upload "$TAG" final-artifacts/* --clobber
        echo "Release artifacts dropped successfully!"
        gh release view "$TAG"

  # ── SLSA Provenance Attestation ─────────────────────────────────────
  provenance:
    needs: [drop_release_artifacts]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.drop_release_artifacts.outputs.hashes }}
      upload-assets: true