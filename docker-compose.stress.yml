services:
  # 1. MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: arkilian-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO Bucket Provisioner
  createbucket:
    image: minio/mc:latest
    container_name: arkilian-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/arkilian-backups;
      /usr/bin/mc anonymous set download myminio/arkilian-backups;
      exit 0;
      "

  # 3. 200M Write / 200M Read / Hydration Stress Test Runner
  stress-runner:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update && apt-get install -y gcc g++ cmake libcurl4-openssl-dev libpthread-stubs0-dev curl wget
        WORKDIR /app
        COPY . .
        RUN cc -O3 tests/stress_200m.c src/class.c src/deps/sqlite/sqlite3.c -Isrc -Isrc/deps/sqlite -lcurl -lpthread -lm -o stress_200m
        CMD ["./stress_200m"]
    container_name: arkilian-stress-runner
    environment:
      ARKILIAN_DB_PATH: "stress_game.db"
      ARKILIAN_BACKUP_PATH: "stress_game_backup.sqlite"
      ARKILIAN_BACKUP_INTERVAL: "14400" # 4 Hours Backup Interval
      ARKILIAN_ENABLE_BACKUP: "1"
      ARKILIAN_S3_ENDPOINT: "http://minio:9000"
      ARKILIAN_S3_BUCKET: "arkilian-backups"
      ARKILIAN_S3_REGION: "us-east-1"
      ARKILIAN_S3_ACCESS_KEY: "minioadmin"
      ARKILIAN_S3_SECRET_KEY: "minioadmin"
      ARKILIAN_S3_PREFIX: "db_stress"
    depends_on:
      createbucket:
        condition: service_completed_successfully
