# Arkilian Local Configuration Example
# Use this file with: arkilian-local --config config-local.yaml

mode: all
data_dir: ./data/arkilian-local

# Storage configuration (local is recommended for local mode)
storage:
  type: local
  path: ./data/arkilian-local/storage

# Ingest service configuration
ingest:
  target_partition_size_mb: 64
  adaptive_sizing:
    enabled: true
    min_size_mb: 16
    max_size_mb: 256
    tiers:
      - threshold_gb: 0
        target_size_mb: 64
      - threshold_gb: 1
        target_size_mb: 128
      - threshold_gb: 10
        target_size_mb: 192
      - threshold_gb: 100
        target_size_mb: 256

# Query service configuration
query:
  concurrency: 10
  pool_size: 100
  max_preload_partitions: 1000
  bloom_cache_size_mb: 1024

# Compaction service configuration
compaction:
  check_interval: 5m
  min_partition_size: 8388608 # 8MB
  max_partitions_per_key: 100
  ttl_days: 7
  backpressure:
    max_concurrency: 4
    min_concurrency: 1
    failure_threshold: 0.10

# WAL configuration
wal:
  dir: ./data/arkilian-local/wal
  max_segment_size: 67108864 # 64MB
  flush_interval: 500ms
  flush_batch_size: 10000
  retention_time: 1h

# Index configuration
index:
  collection: events
  create_threshold: 100
  drop_threshold: 5
  check_interval: 5m
  max_indexes: 10
  bucket_count: 64

# Cache configuration
cache:
  nvme_dir: ./data/arkilian-local/nvme
  nvme_max_bytes: 536870912000 # 500GB
  prefetch_enabled: true

# Router configuration
router:
  buffer_size: 1000

# Manifest configuration
manifest:
  sharded: true
  shard_count: 16
  auto_shard_threshold: 50000
