<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" role="img" aria-label="Arkilian Architecture">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>

    <linearGradient id="engine-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#117BC8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <marker id="arr-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-hydrate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#60A5FA"/>
    </marker>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
      .serif { font-family: "Signifier", Georgia, serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="500" rx="14" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Top Brand Header -->
  <g transform="translate(36, 26)">
    <!-- Arkilian Emblem -->
    <g transform="scale(0.78)">
      <path d="M 14 2 L 17 0.5 L 17 11.5 L 5.5 29 L 1 27.5 L 12.5 4.5 Z" fill="#FFFFFF"/>
      <path d="M 18.5 1 L 21.5 3 L 21.5 12.5 L 18 10.5 Z" fill="#FFFFFF"/>
      <path d="M 17.5 12 L 21.5 14 L 11 31.5 L 2 29 L 6.5 27.5 Z" fill="#FFFFFF"/>
      <path d="M 30 2 L 27 0.5 L 27 11.5 L 38.5 29 L 43 27.5 L 31.5 4.5 Z" fill="#FFFFFF"/>
      <path d="M 25.5 1 L 22.5 3 L 22.5 12.5 L 26 10.5 Z" fill="#FFFFFF"/>
      <path d="M 26.5 12 L 22.5 14 L 33 31.5 L 42 29 L 37.5 27.5 Z" fill="#FFFFFF"/>
      <path d="M 22 16.5 L 28.5 28.5 Q 29 29.5 27.8 29.5 L 16.2 29.5 Q 15 29.5 15.5 28.5 Z" fill="#2563EB"/>
    </g>
    <text x="44" y="20" class="serif" font-size="19" font-weight="500" fill="#FFFFFF" letter-spacing="-0.02em">Arkilian</text>
    <text x="118" y="19" class="sans" font-size="12" fill="#64748B">Architecture</text>
  </g>

  <text x="1044" y="45" text-anchor="end" class="mono" font-size="11" fill="#64748B">3 Dedicated SQLite Connections · Zero Lock Contention</text>

  <line x1="36" y1="66" x2="1044" y2="66" stroke="#1E293B" stroke-width="1"/>

  <!-- ==================================================================== -->
  <!-- COLUMN 1: YOUR APPLICATION                                           -->
  <!-- ==================================================================== -->
  <g transform="translate(36, 102)">
    <rect width="190" height="300" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.25"/>
    <text x="95" y="42" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#F8FAFC">Your Application</text>
    <text x="95" y="62" text-anchor="middle" class="mono" font-size="11" fill="#64748B">In-Process Library</text>

    <line x1="24" y1="82" x2="166" y2="82" stroke="#1E293B" stroke-width="1"/>

    <!-- Write API box -->
    <rect x="20" y="102" width="150" height="64" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <text x="95" y="128" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#E2E8F0">db_exec / db_step</text>
    <text x="95" y="148" text-anchor="middle" class="sans" font-size="11" fill="#94A3B8">Standard SQLite reads/writes</text>

    <!-- SDK list -->
    <rect x="20" y="184" width="150" height="92" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <text x="95" y="208" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="0.06em">NATIVE BINDINGS</text>
    <text x="95" y="230" text-anchor="middle" class="mono" font-size="11" fill="#94A3B8">C99 · Node.js · Python</text>
    <text x="95" y="250" text-anchor="middle" class="mono" font-size="11" fill="#94A3B8">Go · Rust · PHP</text>
  </g>

  <!-- Arrow: App -> Writer Connection -->
  <line x1="226" y1="168" x2="288" y2="168" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arr-white)"/>
  <text x="257" y="158" text-anchor="middle" class="mono" font-size="10" fill="#94A3B8">SQL</text>

  <!-- ==================================================================== -->
  <!-- COLUMN 2: ARKILIAN ENGINE (3 CONNECTIONS)                            -->
  <!-- ==================================================================== -->
  <g transform="translate(296, 90)">
    <rect width="444" height="324" rx="12" fill="#0F172A" stroke="url(#engine-border)" stroke-width="1.5"/>

    <text x="24" y="30" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">Arkilian Embedded Engine</text>
    <text x="420" y="30" text-anchor="end" class="mono" font-size="11" fill="#38BDF8">app.sqlite (WAL Mode)</text>

    <!-- Connection 1: Writer + Outbox -->
    <g transform="translate(20, 46)">
      <rect width="404" height="76" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1.25"/>
      <rect x="0" y="0" width="4" height="76" rx="2" fill="#38BDF8"/>
      <text x="18" y="28" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">1. Primary Writer</text>
      <rect x="136" y="14" width="84" height="20" rx="4" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <text x="178" y="28" text-anchor="middle" class="mono" font-size="10.5" fill="#38BDF8">db-&gt;handle</text>

      <text x="18" y="52" class="sans" font-size="11.5" fill="#94A3B8">Captures DML triggers &amp; DDL into durable <tspan class="mono" fill="#E2E8F0">_pending_backup</tspan> outbox</text>
    </g>

    <!-- Internal vertical connector: Outbox -> Flush Thread -->
    <line x1="222" y1="122" x2="222" y2="142" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Connection 2: Flush Thread -->
    <g transform="translate(20, 144)">
      <rect width="404" height="76" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1.25"/>
      <rect x="0" y="0" width="4" height="76" rx="2" fill="#2563EB"/>
      <text x="18" y="28" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">2. Flush Thread</text>
      <rect x="126" y="14" width="102" height="20" rx="4" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <text x="177" y="28" text-anchor="middle" class="mono" font-size="10.5" fill="#60A5FA">db-&gt;backup_db</text>
      <text x="388" y="28" text-anchor="end" class="mono" font-size="10.5" fill="#38BDF8">Every 1s</text>

      <text x="18" y="52" class="sans" font-size="11.5" fill="#94A3B8">Batches outbox rows into <tspan class="mono" fill="#E2E8F0">SHA-256</tspan> SQL chunks &amp; updates manifest</text>
    </g>

    <!-- Connection 3: Snapshot Thread -->
    <g transform="translate(20, 232)">
      <rect width="404" height="74" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1.25"/>
      <rect x="0" y="0" width="4" height="74" rx="2" fill="#6366F1"/>
      <text x="18" y="28" class="sans" font-size="13" font-weight="600" fill="#FFFFFF">3. Snapshot Thread</text>
      <rect x="148" y="14" width="114" height="20" rx="4" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
      <text x="205" y="28" text-anchor="middle" class="mono" font-size="10.5" fill="#818CF8">db-&gt;snapshot_db</text>
      <text x="388" y="28" text-anchor="end" class="mono" font-size="10.5" fill="#818CF8">Periodic</text>

      <text x="18" y="52" class="sans" font-size="11.5" fill="#94A3B8">Streams non-blocking <tspan class="mono" fill="#E2E8F0">sqlite3_backup_step()</tspan> baseline snapshots</text>
    </g>
  </g>

  <!-- Arrows: Engine -> S3 -->
  <line x1="740" y1="272" x2="824" y2="272" stroke="#38BDF8" stroke-width="1.75" marker-end="url(#arr-blue)"/>
  <text x="782" y="261" text-anchor="middle" class="mono" font-size="10" fill="#38BDF8">SigV4 PUT</text>

  <line x1="740" y1="358" x2="824" y2="358" stroke="#38BDF8" stroke-width="1.75" marker-end="url(#arr-blue)"/>
  <text x="782" y="347" text-anchor="middle" class="mono" font-size="10" fill="#38BDF8">SigV4 PUT</text>

  <!-- ==================================================================== -->
  <!-- COLUMN 3: S3-COMPATIBLE STORAGE                                      -->
  <!-- ==================================================================== -->
  <g transform="translate(832, 102)">
    <rect width="212" height="300" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.25"/>
    <text x="106" y="40" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#F8FAFC">S3 Object Storage</text>
    <text x="106" y="58" text-anchor="middle" class="sans" font-size="11" fill="#64748B">AWS S3 · R2 · MinIO</text>

    <line x1="20" y1="76" x2="192" y2="76" stroke="#1E293B" stroke-width="1"/>

    <!-- Object 1: Manifest -->
    <rect x="18" y="92" width="176" height="56" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <text x="106" y="116" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#60A5FA">manifest.json</text>
    <text x="106" y="135" text-anchor="middle" class="sans" font-size="10.5" fill="#94A3B8">HMAC-SHA256 signed</text>

    <!-- Object 2: Chunks -->
    <rect x="18" y="160" width="176" height="56" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <text x="106" y="184" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#38BDF8">chunks/lsn_*.sql</text>
    <text x="106" y="203" text-anchor="middle" class="sans" font-size="10.5" fill="#94A3B8">1s CDC · SHA-256 verified</text>

    <!-- Object 3: Snapshots -->
    <rect x="18" y="228" width="176" height="56" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
    <text x="106" y="252" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#818CF8">snapshots/*.sqlite</text>
    <text x="106" y="271" text-anchor="middle" class="sans" font-size="10.5" fill="#94A3B8">Baseline · SHA-256 verified</text>
  </g>

  <!-- ==================================================================== -->
  <!-- BOTTOM RETURN PATH: COLD-START HYDRATION                             -->
  <!-- ==================================================================== -->
  <path d="M 938 402 L 938 456 L 518 456 L 518 422" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-hydrate)"/>
  <rect x="612" y="442" width="236" height="26" rx="13" fill="#0F172A" stroke="#1E3A8A" stroke-width="1"/>
  <text x="730" y="459" text-anchor="middle" class="mono" font-size="11" fill="#93C5FD">Cold-Start Restore: arkilian_hydrate_s3()</text>
</svg>
