<svg width="100%" viewBox="0 0 760 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Arkilian Database Architecture</title>
  <desc>Arkilian connection lifecycle showing Main Game Connection writing to Outbox table, Flush thread replicating to push endpoints, and Snapshot thread doing online backups to S3/GCS.</desc>
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 2L7 5L2 8" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #f8fafc; }
    .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .text-mono { font-family: Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    .arrow-line { fill: none; stroke: #475569; stroke-width: 2; }
    .arrow-dashed { fill: none; stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4,4; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0b0f19" />

  <!-- 1. YOUR APP CODE -->
  <g transform="translate(270, 20)" filter="url(#shadow)">
    <rect width="220" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="110" y="26" text-anchor="middle" class="text-title">Your App Code</text>
    <text x="110" y="44" text-anchor="middle" class="text-subtitle" style="fill: #38bdf8;">Runs database queries</text>
  </g>

  <line x1="380" y1="80" x2="380" y2="108" class="arrow-line" marker-end="url(#arrow)" />

  <!-- 2. ARKILIAN INSTANCE (CORE BOUNDARY) -->
  <g transform="translate(30, 110)" filter="url(#shadow)">
    <!-- Core Boundary Container -->
    <rect width="700" height="350" rx="18" fill="url(#coreGrad)" stroke="#1e293b" stroke-width="2" />
    <text x="24" y="28" class="text-title" style="font-size: 16px; font-weight: 700; letter-spacing: 0.5px;">Arkilian Instance</text>
    <text x="24" y="44" class="text-subtitle" style="fill: #38bdf8;">Thread-Safe Client Engine</text>

    <!-- Main Game Connection -->
    <g transform="translate(20, 65)">
      <rect width="190" height="260" rx="12" fill="#151f32" stroke="#1e293b" stroke-width="1.5" />
      <rect width="190" height="40" rx="12" fill="url(#blueGrad)" />
      <text x="95" y="24" text-anchor="middle" class="text-bold">Main Connection</text>
      <text x="95" y="62" text-anchor="middle" class="text-subtitle" style="fill: #93c5fd;">Active Game Thread</text>
      
      <!-- SQLite Engine Box -->
      <g transform="translate(15, 80)">
        <rect width="160" height="70" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <text x="80" y="28" text-anchor="middle" class="text-bold" style="fill: #38bdf8;">SQLite Engine</text>
        <text x="80" y="48" text-anchor="middle" class="text-subtitle">Sync read/write operations</text>
      </g>

      <!-- SQL Triggers Box -->
      <g transform="translate(15, 165)">
        <rect width="160" height="80" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <text x="80" y="26" text-anchor="middle" class="text-bold" style="fill: #f97316;">SQL Triggers</text>
        <text x="80" y="45" text-anchor="middle" class="text-subtitle">Intercept writes, populate</text>
        <text x="80" y="62" text-anchor="middle" class="text-mono" style="fill: #f97316;">_pending_backup</text>
      </g>
    </g>

    <!-- Outbox database table -->
    <g transform="translate(240, 165)">
      <rect width="220" height="130" rx="12" fill="#151f32" stroke="#1e293b" stroke-width="1.5" />
      <rect width="220" height="40" rx="12" fill="url(#orangeGrad)" />
      <text x="110" y="25" text-anchor="middle" class="text-bold">Outbox Table</text>
      
      <path d="M 20,62 L 200,62 M 20,85 L 200,85 M 20,108 L 200,108" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="70" text-anchor="middle" class="text-mono" style="font-size: 10px;">_pending_backup</text>
      <text x="110" y="94" text-anchor="middle" class="text-subtitle" style="fill: #f97316; font-weight: 600;">Max Cap: 100,000 rows</text>
      <text x="110" y="112" text-anchor="middle" class="text-subtitle">CDC Queue</text>
    </g>

    <!-- Flush Thread -->
    <g transform="translate(490, 65)">
      <rect width="190" height="115" rx="12" fill="#151f32" stroke="#1e293b" stroke-width="1.5" />
      <rect width="190" height="40" rx="12" fill="url(#greenGrad)" />
      <text x="95" y="25" text-anchor="middle" class="text-bold">Flush Thread</text>
      
      <rect x="15" y="55" width="160" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="95" y="72" text-anchor="middle" class="text-bold" style="font-size: 12px; fill: #34d399;">`backup_db` Conn</text>
      <text x="95" y="87" text-anchor="middle" class="text-subtitle">Drains outbox batches</text>
    </g>

    <!-- Snapshot Thread -->
    <g transform="translate(490, 195)">
      <rect width="190" height="135" rx="12" fill="#151f32" stroke="#1e293b" stroke-width="1.5" />
      <rect width="190" height="40" rx="12" fill="url(#greenGrad)" />
      <text x="95" y="25" text-anchor="middle" class="text-bold">Snapshot Thread</text>
      
      <rect x="15" y="55" width="160" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="95" y="72" text-anchor="middle" class="text-bold" style="font-size: 12px; fill: #34d399;">`snapshot_db` Conn</text>
      <text x="95" y="90" text-anchor="middle" class="text-subtitle">Online Backup to</text>
      <text x="95" y="104" text-anchor="middle" class="text-mono" style="font-size: 10px;">backup.sqlite</text>
    </g>
  </g>

  <!-- Connectors inside Core -->
  <path d="M 225,320 L 300,320 L 300,295" class="arrow-line" marker-end="url(#arrow)" />
  <path d="M 350,165 L 350,122 L 490,122" class="arrow-line" marker-end="url(#arrow)" />
  <path d="M 115,375 L 115,440 L 585,440 L 585,330" class="arrow-line" marker-end="url(#arrow)" />

  <!-- 3. EXTERNAL TARGETS -->
  <!-- S3 / GCS Storage -->
  <g transform="translate(30, 490)" filter="url(#shadow)">
    <rect width="210" height="70" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <rect width="210" height="6" rx="3" fill="url(#purpleGrad)" />
    <text x="105" y="28" text-anchor="middle" class="text-bold" style="fill: #c084fc;">S3 / GCS Storage</text>
    <text x="105" y="46" text-anchor="middle" class="text-subtitle">Presigned upload target</text>
    <text x="105" y="58" text-anchor="middle" class="text-subtitle" style="font-weight: bold; fill: #c084fc;">Hourly Snapshots</text>
  </g>

  <!-- arkilian.com API -->
  <g transform="translate(275, 490)" filter="url(#shadow)">
    <rect width="210" height="70" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <rect width="210" height="6" rx="3" fill="url(#purpleGrad)" />
    <text x="105" y="28" text-anchor="middle" class="text-bold" style="fill: #c084fc;">arkilian.com API</text>
    <text x="105" y="46" text-anchor="middle" class="text-mono" style="font-size: 10px;">/v1/upload/request</text>
    <text x="105" y="58" text-anchor="middle" class="text-subtitle">Request Presigned URLs</text>
  </g>

  <!-- Push Endpoint -->
  <g transform="translate(520, 490)" filter="url(#shadow)">
    <rect width="210" height="70" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <rect width="210" height="6" rx="3" fill="url(#purpleGrad)" />
    <text x="105" y="28" text-anchor="middle" class="text-bold" style="fill: #c084fc;">Push Endpoint</text>
    <text x="105" y="46" text-anchor="middle" class="text-mono" style="font-size: 10px;">/v1/wal/push</text>
    <text x="105" y="58" text-anchor="middle" class="text-subtitle" style="font-weight: bold; fill: #34d399;">Real-Time CDC Stream (&lt;2s)</text>
  </g>

  <!-- Connectors to External Targets -->
  <path d="M 625,180 L 625,490" class="arrow-line" marker-end="url(#arrow)" />
  <path d="M 530,330 L 380,330 L 380,490" class="arrow-line" marker-end="url(#arrow)" />
  <path d="M 490,320 L 135,320 L 135,490" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Sticky Flags / State Monitoring -->
  <path d="M 350,295 L 350,380 L 400,380" class="arrow-dashed" marker-end="url(#arrow)" />
  
  <g transform="translate(410, 362)" filter="url(#shadow)">
    <rect width="135" height="34" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
    <text x="67" y="21" text-anchor="middle" class="text-bold" style="fill: #fca5a5; font-size: 10px; letter-spacing: 0.5px;">capture_paused = 1</text>
  </g>
  
  <path d="M 490,260 L 478,260 L 478,362" class="arrow-dashed" style="stroke: #10b981;" marker-end="url(#arrow)" />

</svg>