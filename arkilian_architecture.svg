<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Arkilian Architecture</title>
  <desc>Your app calls into the arkilian connection. Write triggers automatically populate the internal _pending_backup outbox table. An independent Flush Thread reads batches from the outbox and POSTs them to the push endpoint. The Snapshot Thread independently triggers an hourly online backup to S3/GCS using presigned URLs requested from the control plane API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .text-base { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 16px; font-weight: 400; text-anchor: start; dominant-baseline: auto; }
      .text-title { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
      .text-desc { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .text-header { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; text-anchor: start; dominant-baseline: auto; }
      .text-sub { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; text-anchor: start; dominant-baseline: auto; }
      .line-conn { fill: none; stroke: rgb(115, 114, 108); stroke-width: 1.5; }
      .line-dashed { fill: none; stroke: rgb(153, 60, 29); stroke-width: 1.5; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- 1. YOUR APP CODE -->
  <g class="text-base">
    <rect x="230" y="40" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);"/>
    <text x="340" y="58" class="text-title" style="fill:rgb(68, 68, 65);">Your app code</text>
    <text x="340" y="76" class="text-desc" style="fill:rgb(95, 94, 90);">Calls the public API</text>
  </g>

  <!-- Connection to Main Handle -->
  <line x1="340" y1="96" x2="340" y2="138" marker-end="url(#arrow)" class="line-conn"/>

  <!-- 2. ARKILIAN CONNECTION (CONTAINER) -->
  <g class="text-base">
    <rect x="50" y="140" width="580" height="310" rx="20" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);"/>
    <text x="80" y="172" class="text-header" style="fill:rgb(60, 52, 137);">arkilian connection</text>
    <text x="80" y="190" class="text-sub" style="fill:rgb(83, 74, 183);">one per open database handle</text>
  </g>

  <!-- Main Game Connection (left box) -->
  <g class="text-base">
    <rect x="80" y="210" width="230" height="220" rx="12" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);"/>
    <text x="195" y="235" class="text-title" style="fill:rgb(8, 80, 65);">Main Connection</text>
    <text x="195" y="253" class="text-desc" style="fill:rgb(15, 110, 86);">Game Thread</text>

    <!-- SQLite Engine -->
    <rect x="95" y="275" width="200" height="50" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);"/>
    <text x="195" y="291" class="text-title" style="fill:rgb(68, 68, 65);">SQLite Engine</text>
    <text x="195" y="309" class="text-desc" style="fill:rgb(95, 94, 90);">executes writes synchronously</text>

    <!-- SQL Triggers -->
    <rect x="95" y="340" width="200" height="70" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);"/>
    <text x="195" y="358" class="text-title" style="fill:rgb(68, 68, 65);">SQL Triggers</text>
    <text x="195" y="376" class="text-desc" style="fill:rgb(95, 94, 90);">captures write metadata to</text>
    <text x="195" y="394" class="text-desc" style="font-family: monospace; font-size: 11px; fill:rgb(15, 110, 86);">_pending_backup</text>
  </g>

  <!-- Outbox Table (center box) -->
  <g class="text-base">
    <rect x="330" y="250" width="130" height="140" rx="12" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);"/>
    <text x="395" y="275" class="text-title" style="fill:rgb(8, 80, 65);">Outbox Table</text>
    <text x="395" y="295" class="text-desc" style="font-family: monospace; font-size: 11px; fill:rgb(15, 110, 86);">_pending_backup</text>
    <path d="M 345,315 L 445,315 M 345,335 L 445,335 M 345,355 L 445,355" stroke="rgb(15, 110, 86)" stroke-width="1" />
    <text x="395" y="375" class="text-desc" style="fill:rgb(15, 110, 86); font-weight: bold;">Cap: 100k</text>
  </g>

  <!-- Connectors between Connection, Engine, Triggers and Outbox -->
  <!-- App API call hits SQLite Engine -->
  <line x1="340" y1="138" x2="195" y2="138" class="line-conn"/>
  <line x1="195" y1="138" x2="195" y2="275" marker-end="url(#arrow)" class="line-conn"/>
  
  <!-- Engine feeds Triggers -->
  <line x1="195" y1="325" x2="195" y2="340" marker-end="url(#arrow)" class="line-conn"/>

  <!-- Triggers write to Outbox -->
  <line x1="295" y1="375" x2="330" y2="375" marker-end="url(#arrow)" class="line-conn"/>

  <!-- 3. EXTERNAL THREADS (BOTTOM RED BOXES) -->
  <!-- Snapshot Thread -->
  <g class="text-base">
    <rect x="95" y="470" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);"/>
    <text x="205" y="488" class="text-title" style="fill:rgb(113, 43, 19);">Snapshot thread</text>
    <text x="205" y="506" class="text-desc" style="fill:rgb(153, 60, 29);">hourly online backup to GCS/S3</text>
  </g>

  <!-- Flush Thread -->
  <g class="text-base">
    <rect x="365" y="470" width="220" height="56" rx="8" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);"/>
    <text x="475" y="488" class="text-title" style="fill:rgb(113, 43, 19);">Flush thread</text>
    <text x="475" y="506" class="text-desc" style="fill:rgb(153, 60, 29);">POSTs CDC batches to endpoint</text>
  </g>

  <!-- Connectors from Outbox and SQLite Engine to Threads -->
  <!-- Flush thread drains Outbox -->
  <path d="M 395,390 L 395,440 L 475,440 L 475,470" marker-end="url(#arrow)" class="line-conn"/>

  <!-- Snapshot thread runs Online Backup from SQLite Engine -->
  <path d="M 195,430 L 195,450 L 205,450 L 205,470" marker-end="url(#arrow)" class="line-conn"/>

  <!-- Sticky Flags / State Monitoring -->
  <!-- Outbox Cap triggers sticky capture_paused -->
  <path d="M 460,320 L 515,320 M 515,320 L 515,370" marker-end="url(#arrow)" class="line-dashed"/>

  <g class="text-base" transform="translate(470, 375)">
    <rect x="0" y="0" width="130" height="30" rx="4" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);"/>
    <text x="65" y="15" class="text-title" style="font-size: 10px; fill:rgb(113, 43, 19);">capture_paused = 1</text>
  </g>

  <!-- Snapshot thread clears sticky capture_paused -->
  <path d="M 205,526 L 205,546 L 535,546 L 535,405" marker-end="url(#arrow)" class="line-dashed" style="stroke: rgb(15, 110, 86);"/>

</svg>