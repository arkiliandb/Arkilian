<svg width="100%" viewBox="0 0 880 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Arkilian Architecture</title>
  <desc>Your app calls into the arkilian connection. Arkilian uses three dedicated SQLite connections (db->handle for App writes, db->backup_db for WAL chunk shipping, db->snapshot_db for hourly backups) to eliminate cross-thread lock contention. Writes are captured via DML triggers (sync_backup_triggers) and transaction-aware sidecar DDL (.arkddlqueue) into the _pending_backup outbox table. The Flush Thread batches outbox rows and PUTs chunks to S3, updating the HMAC-signed manifest registry. The Snapshot Thread performs non-blocking online snapshots (sqlite3_backup_step) to backup.sqlite. Cold-start disaster recovery (arkilian_hydrate_s3) replays the signed manifest, snapshot, and chunks.</desc>
  <defs>
    <!-- Solid Crisp Arrowheads -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="rgb(100, 100, 95)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="rgb(15, 110, 86)"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="rgb(180, 75, 40)"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="rgb(99, 87, 219)"/>
    </marker>

    <style>
      .text-base { font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; text-anchor: start; }
      .text-title { font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .text-desc { font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; text-anchor: middle; }
      .text-header { font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; text-anchor: start; }
      .text-sub { font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; text-anchor: start; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 10px; }
      
      .line-conn { fill: none; stroke: rgb(100, 100, 95); stroke-width: 1.5; stroke-linecap: round; }
      .line-green { fill: none; stroke: rgb(15, 110, 86); stroke-width: 1.5; stroke-linecap: round; }
      .line-orange { fill: none; stroke: rgb(180, 75, 40); stroke-width: 1.5; stroke-linecap: round; }
      .line-purple { fill: none; stroke: rgb(99, 87, 219); stroke-width: 1.5; stroke-dasharray: 4,4; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ================================================================== -->
  <!-- 1. YOUR APP CODE (Aligned directly above App Thread)               -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="45" y="20" width="225" height="48" rx="8" stroke-width="0.8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);"/>
    <text x="157" y="40" class="text-title" style="fill:rgb(50, 50, 48);">Your Application Code</text>
    <text x="157" y="56" class="text-desc" style="fill:rgb(100, 100, 95);">Calls public API (db_exec, db_step)</text>
  </g>

  <!-- Clean Vertical Arrow: App Code -> Primary SQLite Handle -->
  <line x1="157" y1="68" x2="157" y2="128" marker-end="url(#arrow-gray)" class="line-conn"/>

  <!-- ================================================================== -->
  <!-- 2. ARKILIAN CONNECTION CONTAINER (Spec §3.1 / §3.3)                 -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="30" y="85" width="820" height="345" rx="14" stroke-width="0.8" style="fill:rgb(244, 243, 255);stroke:rgb(99, 87, 219);"/>
    <text x="48" y="108" class="text-header" style="fill:rgb(60, 52, 137);">arkilian connection</text>
    <text x="195" y="108" class="text-sub" style="fill:rgb(99, 87, 219);">Three dedicated SQLite connections — zero cross-thread mutex contention (Spec §3.1)</text>
  </g>

  <!-- ================================================================== -->
  <!-- 2A. COLUMN 1: APP / WRITER THREAD (db->handle)                     -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="45" y="125" width="225" height="290" rx="8" stroke-width="0.8" style="fill:rgb(228, 247, 240);stroke:rgb(15, 110, 86);"/>
    <text x="157" y="147" class="text-title" style="fill:rgb(8, 80, 65);">App / Writer Thread</text>
    <text x="157" y="163" class="text-desc text-mono" style="fill:rgb(15, 110, 86);">Primary: db->handle</text>

    <!-- Subcard: SQLite Engine -->
    <rect x="58" y="175" width="199" height="56" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(170, 195, 185);"/>
    <text x="157" y="196" class="text-title" style="fill:rgb(50, 50, 48);">SQLite Engine</text>
    <text x="157" y="214" class="text-desc" style="fill:rgb(90, 90, 85);">executes writes in WAL mode</text>

    <!-- Subcard: Capture Subsystem -->
    <rect x="58" y="255" width="199" height="145" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(170, 195, 185);"/>
    <text x="157" y="275" class="text-title" style="fill:rgb(8, 80, 65);">Capture Subsystem</text>
    
    <text x="157" y="295" class="text-desc text-mono" style="fill:rgb(15, 110, 86); font-weight: 600;">sync_backup_triggers()</text>
    <text x="157" y="310" class="text-desc" style="fill:rgb(90, 90, 85); font-size: 10.5px;">AFTER INSERT/UPDATE/DELETE</text>
    <text x="157" y="325" class="text-desc" style="fill:rgb(90, 90, 85); font-size: 10px;">captures PK row-level DML</text>
    
    <line x1="70" y1="335" x2="245" y2="335" stroke="rgb(210, 225, 220)" stroke-width="0.8"/>
    
    <text x="157" y="352" class="text-desc text-mono" style="fill:rgb(15, 110, 86); font-weight: 600;">trace_raw_ddl (.arkddlqueue)</text>
    <text x="157" y="368" class="text-desc" style="fill:rgb(90, 90, 85); font-size: 10px;">journals DDL &amp; savepoints</text>
    <text x="157" y="384" class="text-desc text-mono" style="fill:rgb(180, 75, 40); font-size: 9.5px;">on_schema_authorizer</text>
  </g>

  <!-- Clean Vertical Arrow: SQLite Engine -> Capture Subsystem -->
  <line x1="157" y1="231" x2="157" y2="255" marker-end="url(#arrow-green)" class="line-green"/>

  <!-- ================================================================== -->
  <!-- 2B. COLUMN 2: OUTBOX TABLE (_pending_backup)                       -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="285" y="125" width="145" height="290" rx="8" stroke-width="0.8" style="fill:rgb(228, 247, 240);stroke:rgb(15, 110, 86);"/>
    <text x="357" y="147" class="text-title" style="fill:rgb(8, 80, 65);">Outbox Table</text>
    <text x="357" y="163" class="text-desc text-mono" style="fill:rgb(15, 110, 86); font-weight: 600;">_pending_backup</text>

    <!-- Queue Box -->
    <rect x="296" y="175" width="123" height="130" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(170, 195, 185);"/>
    <text x="357" y="196" class="text-desc text-mono" style="fill:rgb(100, 100, 100); font-size: 9.5px;">lsn | table | op | row</text>
    <line x1="305" y1="205" x2="410" y2="205" stroke="rgb(210, 225, 220)" stroke-width="0.8"/>
    
    <text x="357" y="226" class="text-title" style="fill:rgb(8, 80, 65);">Cap: 100k rows</text>
    <text x="357" y="244" class="text-desc" style="fill:rgb(70, 100, 85); font-size: 10.5px;">Pauses CDC at cap</text>
    <text x="357" y="260" class="text-desc" style="fill:rgb(70, 100, 85); font-size: 10px;">(Never stalls app writes)</text>
    <line x1="305" y1="272" x2="410" y2="272" stroke="rgb(210, 225, 220)" stroke-width="0.8"/>
    <text x="357" y="291" class="text-desc text-mono" style="fill:rgb(15, 110, 86); font-size: 9px;">synchronous=FULL</text>

    <!-- DLQ & Meta Box -->
    <rect x="296" y="315" width="123" height="85" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(170, 195, 185);"/>
    <text x="357" y="335" class="text-desc text-mono" style="fill:rgb(180, 60, 30); font-weight: 600;">_dead_backup</text>
    <text x="357" y="352" class="text-desc" style="fill:rgb(100, 100, 95); font-size: 10px;">DLQ (100 retries max)</text>
    <line x1="305" y1="363" x2="410" y2="363" stroke="rgb(210, 225, 220)" stroke-width="0.8"/>
    <text x="357" y="382" class="text-desc text-mono" style="fill:rgb(15, 110, 86); font-weight: 600;">_arkilian_meta</text>
  </g>

  <!-- Clean Horizontal Arrow: Capture Subsystem -> Outbox Table -->
  <line x1="257" y1="327" x2="285" y2="327" marker-end="url(#arrow-green)" class="line-green"/>

  <!-- ================================================================== -->
  <!-- 2C. COLUMN 3: WAL FLUSH THREAD (db->backup_db)                     -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="445" y="125" width="195" height="290" rx="8" stroke-width="0.8" style="fill:rgb(254, 242, 237);stroke:rgb(180, 75, 40);"/>
    <text x="542" y="147" class="text-title" style="fill:rgb(130, 45, 20);">Flush Thread (Realtime)</text>
    <text x="542" y="163" class="text-desc text-mono" style="fill:rgb(180, 75, 40);">Dedicated: db->backup_db</text>

    <!-- Shipping Card -->
    <rect x="456" y="175" width="173" height="110" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(225, 195, 180);"/>
    <text x="542" y="196" class="text-title" style="fill:rgb(130, 45, 20);">Chunk Shipping</text>
    <text x="542" y="214" class="text-desc" style="fill:rgb(90, 90, 85);">Drains outbox batches</text>
    <text x="542" y="230" class="text-desc text-mono" style="fill:rgb(130, 45, 20); font-size: 9.5px;">in-memory wal_chunk</text>
    <text x="542" y="248" class="text-desc" style="fill:rgb(90, 90, 85); font-weight: 600;">AWS SigV4 Presigning</text>
    <text x="542" y="264" class="text-desc" style="fill:rgb(180, 75, 40); font-size: 9.5px;">SSRF &amp; cleartext guards</text>

    <!-- Manifest Card -->
    <rect x="456" y="295" width="173" height="105" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(225, 195, 180);"/>
    <text x="542" y="316" class="text-title" style="fill:rgb(130, 45, 20);">Manifest Registry</text>
    <text x="542" y="334" class="text-desc" style="fill:rgb(90, 90, 85);">Maintains LSN sequence</text>
    <text x="542" y="352" class="text-desc text-mono" style="fill:rgb(180, 75, 40);">manifest.json</text>
    <text x="542" y="368" class="text-desc text-mono" style="fill:rgb(180, 75, 40);">+ manifest.sig</text>
    <text x="542" y="384" class="text-desc" style="fill:rgb(130, 45, 20); font-size: 9px; font-weight: 600;">HMAC-SHA256 authenticated</text>
  </g>

  <!-- Clean Horizontal Arrow: Outbox Table -> Flush Thread -->
  <line x1="430" y1="230" x2="445" y2="230" marker-end="url(#arrow-orange)" class="line-orange"/>

  <!-- ================================================================== -->
  <!-- 2D. COLUMN 4: HOURLY SNAPSHOT THREAD (db->snapshot_db)             -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="655" y="125" width="180" height="290" rx="8" stroke-width="0.8" style="fill:rgb(254, 242, 237);stroke:rgb(180, 75, 40);"/>
    <text x="745" y="147" class="text-title" style="fill:rgb(130, 45, 20);">Snapshot Thread (Hourly)</text>
    <text x="745" y="163" class="text-desc text-mono" style="fill:rgb(180, 75, 40);">Dedicated: db->snapshot_db</text>

    <!-- Online Copy Card -->
    <rect x="666" y="175" width="158" height="110" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(225, 195, 180);"/>
    <text x="745" y="196" class="text-title" style="fill:rgb(130, 45, 20);">Online Backup</text>
    <text x="745" y="214" class="text-desc text-mono" style="fill:rgb(180, 75, 40); font-size: 9.5px;">sqlite3_backup_step()</text>
    <text x="745" y="232" class="text-desc" style="fill:rgb(90, 90, 85);">Non-blocking point-in-time</text>
    <text x="745" y="248" class="text-desc" style="fill:rgb(90, 90, 85);">page copy of database</text>
    <text x="745" y="266" class="text-desc" style="fill:rgb(70, 70, 70); font-size: 10px;">Staged to unique temp file</text>

    <!-- Prune Card -->
    <rect x="666" y="295" width="158" height="105" rx="6" stroke-width="0.8" style="fill:rgb(255, 255, 255);stroke:rgb(225, 195, 180);"/>
    <text x="745" y="316" class="text-title" style="fill:rgb(130, 45, 20);">Snapshot Upload</text>
    <text x="745" y="334" class="text-desc text-mono" style="fill:rgb(180, 75, 40);">PUT backup.sqlite</text>
    <text x="745" y="352" class="text-desc" style="fill:rgb(90, 90, 85);">Advances baseline LSN</text>
    <text x="745" y="368" class="text-desc" style="fill:rgb(90, 90, 85);">Prunes superseded chunks</text>
    <text x="745" y="384" class="text-desc" style="fill:rgb(130, 45, 20); font-size: 9px;">Republishes signed manifest</text>
  </g>

  <!-- ================================================================== -->
  <!-- 3. S3-COMPATIBLE STORAGE (Bottom Container)                        -->
  <!-- ================================================================== -->
  <g class="text-base">
    <rect x="30" y="460" width="820" height="125" rx="12" stroke-width="0.8" style="fill:rgb(245, 247, 252);stroke:rgb(70, 95, 150);"/>
    <text x="48" y="482" class="text-header" style="fill:rgb(40, 65, 120);">S3-Compatible Object Storage</text>
    <text x="250" y="482" class="text-sub" style="fill:rgb(90, 110, 150);">AWS S3 / MinIO / Cloudflare R2 / Ceph — Target prefix: {ARKILIAN_S3_PREFIX}/</text>

    <!-- Artifact 1: Manifest -->
    <rect x="45" y="495" width="225" height="74" rx="6" stroke-width="0.6" style="fill:rgb(255, 255, 255);stroke:rgb(180, 195, 225);"/>
    <text x="157" y="516" class="text-title text-mono" style="fill:rgb(40, 65, 120);">manifest.json + .sig</text>
    <text x="157" y="534" class="text-desc" style="fill:rgb(70, 70, 75);">Durable atomic registry</text>
    <text x="157" y="552" class="text-desc" style="fill:rgb(180, 75, 40); font-weight: 600;">HMAC-SHA256 signature</text>

    <!-- Artifact 2: Chunks -->
    <rect x="285" y="495" width="260" height="74" rx="6" stroke-width="0.6" style="fill:rgb(255, 255, 255);stroke:rgb(180, 195, 225);"/>
    <text x="415" y="516" class="text-title text-mono" style="fill:rgb(40, 65, 120);">chunks/lsn_*.sql</text>
    <text x="415" y="534" class="text-desc" style="fill:rgb(70, 70, 75);">Incremental CDC SQL chunks</text>
    <text x="415" y="552" class="text-desc" style="fill:rgb(15, 110, 86); font-weight: 600;">SHA-256 digest per chunk</text>

    <!-- Artifact 3: Snapshot -->
    <rect x="560" y="495" width="275" height="74" rx="6" stroke-width="0.6" style="fill:rgb(255, 255, 255);stroke:rgb(180, 195, 225);"/>
    <text x="697" y="516" class="text-title text-mono" style="fill:rgb(40, 65, 120);">backup.sqlite</text>
    <text x="697" y="534" class="text-desc" style="fill:rgb(70, 70, 75);">Hourly full database snapshot</text>
    <text x="697" y="552" class="text-desc" style="fill:rgb(40, 65, 120);">Consistent baseline copy</text>
  </g>

  <!-- Clean Vertical Arrow: Flush Thread -> S3 Storage (Chunks/Manifest) -->
  <line x1="542" y1="415" x2="542" y2="460" marker-end="url(#arrow-orange)" class="line-orange"/>

  <!-- Clean Vertical Arrow: Snapshot Thread -> S3 Storage (backup.sqlite) -->
  <line x1="745" y1="415" x2="745" y2="460" marker-end="url(#arrow-orange)" class="line-orange"/>

  <!-- ================================================================== -->
  <!-- 4. COLD-START HYDRATION (Clean rectangular return path)            -->
  <!-- ================================================================== -->
  <path d="M 45,532 L 18,532 L 18,203 L 45,203" marker-end="url(#arrow-purple)" class="line-purple"/>
  
  <rect x="8" y="345" width="20" height="75" rx="3" fill="rgb(244, 243, 255)" stroke="rgb(99, 87, 219)" stroke-width="0.6"/>
  <g class="text-base" transform="translate(22, 412) rotate(-90)">
    <text x="0" y="0" class="text-desc text-mono" style="fill:rgb(99, 87, 219); font-weight: 600; font-size: 8.5px;">arkilian_hydrate_s3()</text>
  </g>

</svg>