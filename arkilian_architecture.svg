<svg width="100%" viewBox="0 0 740 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Arkilian Database Architecture</title>
  <desc>Your app code executes SQLite statements synchronously on the Main Game Connection. Write triggers automatically write incremental CDC SQL rows to the _pending_backup outbox table. An independent Flush Thread reads batches from the outbox, POSTs them to the push endpoint, and cleans up on success. If the outbox reaches its cap, it sets a sticky capture_paused flag. The Snapshot Thread independently triggers an hourly online backup to a local backup file, obtains a pre-signed URL, uploads it to S3/GCS storage, and clears the capture_paused flag.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .text-title { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #111111; }
      .text-subtitle { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #666666; }
      .text-bold { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; }
      .box-app { fill: #f8f9fa; stroke: #bdc3c7; stroke-width: 1.5; }
      .box-core { fill: #f0f4f8; stroke: #3182ce; stroke-width: 2; }
      .box-sqlite { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 1.5; }
      .box-table { fill: #fffaf0; stroke: #dd6b20; stroke-width: 1.5; }
      .box-thread { fill: #f0fff4; stroke: #38a169; stroke-width: 1.5; }
      .box-dest { fill: #fcf5ff; stroke: #805ad5; stroke-width: 1.5; }
      .arrow-line { fill: none; stroke: #73726c; stroke-width: 1.5; }
      .arrow-dashed { fill: none; stroke: #73726c; stroke-width: 1.5; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- 1. YOUR APP CODE -->
  <g transform="translate(260, 20)">
    <rect width="220" height="56" rx="8" class="box-app" />
    <text x="110" y="24" text-anchor="middle" class="text-title">Your App Code</text>
    <text x="110" y="42" text-anchor="middle" class="text-subtitle">Executes synchronous SQL writes</text>
  </g>

  <line x1="370" y1="76" x2="370" y2="108" class="arrow-line" marker-end="url(#arrow)" />

  <!-- 2. ARKILIAN INSTANCE (CORE BOUNDARY) -->
  <g transform="translate(40, 110)">
    <rect width="660" height="340" rx="16" class="box-core" />
    <text x="20" y="25" class="text-title" style="fill: #2b6cb0;">Arkilian Instance</text>
    <text x="20" y="40" class="text-subtitle" style="fill: #4a5568;">Thread-safe wrapped database context</text>

    <!-- Main Game Connection -->
    <g transform="translate(20, 60)">
      <rect width="180" height="240" rx="8" class="box-sqlite" />
      <text x="90" y="25" text-anchor="middle" class="text-title" style="fill: #2b6cb0;">Main Connection</text>
      <text x="90" y="42" text-anchor="middle" class="text-subtitle">Game Thread</text>
      
      <g transform="translate(15, 65)">
        <rect width="150" height="60" rx="6" style="fill: #ffffff; stroke: #4299e1;" />
        <text x="75" y="24" text-anchor="middle" class="text-bold" style="fill: #2b6cb0;">SQLite Engine</text>
        <text x="75" y="42" text-anchor="middle" class="text-subtitle">Synchronous Write</text>
      </g>

      <g transform="translate(15, 145)">
        <rect width="150" height="70" rx="6" style="fill: #fffaf0; stroke: #dd6b20;" />
        <text x="75" y="22" text-anchor="middle" class="text-bold" style="fill: #dd6b20;">SQL Triggers</text>
        <text x="75" y="40" text-anchor="middle" class="text-subtitle">Capture hook writes to</text>
        <text x="75" y="55" text-anchor="middle" class="text-mono" style="fill: #dd6b20;">_pending_backup</text>
      </g>
    </g>

    <!-- Outbox database table -->
    <g transform="translate(230, 155)">
      <rect width="200" height="110" rx="8" class="box-table" />
      <text x="100" y="25" text-anchor="middle" class="text-title" style="fill: #c05621;">Outbox Table</text>
      <text x="100" y="42" text-anchor="middle" class="text-mono" style="fill: #c05621;">_pending_backup</text>
      <path d="M 20,60 L 180,60 M 20,80 L 180,80 M 20,100 L 180,100" stroke="#fbd38d" stroke-width="1.5" />
      <text x="100" y="72" text-anchor="middle" class="text-subtitle" style="fill: #dd6b20;">Incremental CDC Queue</text>
      <text x="100" y="95" text-anchor="middle" class="text-subtitle" style="fill: #e53e3e; font-weight: bold;">Cap: 100k rows</text>
    </g>

    <!-- Flush Thread -->
    <g transform="translate(460, 60)">
      <rect width="180" height="110" rx="8" class="box-thread" />
      <text x="90" y="25" text-anchor="middle" class="text-title" style="fill: #22543d;">Flush Thread</text>
      <text x="90" y="42" text-anchor="middle" class="text-subtitle">Background replication</text>
      <rect x="15" y="60" width="150" height="36" rx="6" style="fill: #ffffff; stroke: #48bb78;" />
      <text x="90" y="76" text-anchor="middle" class="text-bold" style="fill: #276749;">`backup_db` Conn</text>
      <text x="90" y="90" text-anchor="middle" class="text-subtitle">Drains outbox batch</text>
    </g>

    <!-- Snapshot Thread -->
    <g transform="translate(460, 190)">
      <rect width="180" height="130" rx="8" class="box-thread" />
      <text x="90" y="25" text-anchor="middle" class="text-title" style="fill: #22543d;">Snapshot Thread</text>
      <text x="90" y="42" text-anchor="middle" class="text-subtitle">Background hourly</text>
      <rect x="15" y="60" width="150" height="56" rx="6" style="fill: #ffffff; stroke: #48bb78;" />
      <text x="90" y="76" text-anchor="middle" class="text-bold" style="fill: #276749;">`snapshot_db` Conn</text>
      <text x="90" y="93" text-anchor="middle" class="text-subtitle">Online Backup API to</text>
      <text x="90" y="106" text-anchor="middle" class="text-mono" style="fill: #22543d;">backup.sqlite</text>
    </g>
  </g>

  <!-- Connectors inside Core -->
  <!-- Triggers write to Outbox -->
  <path d="M 215,315 L 290,315 L 290,265" class="arrow-line" marker-end="url(#arrow)" />
  
  <!-- Flush Thread reads/deletes Outbox -->
  <path d="M 330,155 L 330,115 L 460,115" class="arrow-line" marker-end="url(#arrow)" />
  
  <!-- Main Connection feeds Online Backup -->
  <path d="M 130,370 L 130,420 L 550,420 L 550,320" class="arrow-line" marker-end="url(#arrow)" />

  <!-- 3. EXTERNAL TARGETS -->
  <!-- WAL Push Endpoint -->
  <g transform="translate(500, 480)">
    <rect width="200" height="70" rx="8" class="box-dest" />
    <text x="100" y="24" text-anchor="middle" class="text-title" style="fill: #44337a;">Push Endpoint</text>
    <text x="100" y="42" text-anchor="middle" class="text-mono">/v1/wal/push</text>
    <text x="100" y="58" text-anchor="middle" class="text-subtitle">Replay CDC Stream (&lt;2s)</text>
  </g>

  <!-- GCS / AWS S3 Storage -->
  <g transform="translate(40, 480)">
    <rect width="200" height="70" rx="8" class="box-dest" />
    <text x="100" y="24" text-anchor="middle" class="text-title" style="fill: #44337a;">S3 / GCS Storage</text>
    <text x="100" y="42" text-anchor="middle" class="text-subtitle">Presigned upload target</text>
    <text x="100" y="58" text-anchor="middle" class="text-subtitle">Hourly Snapshot Files</text>
  </g>

  <!-- Control Plane API (for signed URLs) -->
  <g transform="translate(270, 480)">
    <rect width="200" height="70" rx="8" class="box-dest" />
    <text x="100" y="24" text-anchor="middle" class="text-title" style="fill: #44337a;">arkilian.com API</text>
    <text x="100" y="42" text-anchor="middle" class="text-mono">/v1/upload/request</text>
    <text x="100" y="58" text-anchor="middle" class="text-subtitle">Issues GCS/S3 signed URLs</text>
  </g>

  <!-- Connectors to External Targets -->
  <!-- Flush thread POSTs WAL -->
  <path d="M 600,170 L 600,480" class="arrow-line" marker-end="url(#arrow)" />
  
  <!-- Snapshot thread requests Signed URL -->
  <path d="M 500,290 L 370,290 L 370,480" class="arrow-line" marker-end="url(#arrow)" />
  
  <!-- Snapshot thread uploads backup file to S3 -->
  <path d="M 460,310 L 140,310 L 140,480" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Sticky Flags / State Monitoring -->
  <!-- Outbox Cap triggers sticky capture_paused -->
  <path d="M 330,265 L 330,345 L 390,345" class="arrow-dashed" marker-end="url(#arrow)" />
  
  <g transform="translate(395, 330)">
    <rect width="115" height="30" rx="4" style="fill: #fff5f5; stroke: #feb2b2; stroke-width: 1;" />
    <text x="57" y="18" text-anchor="middle" class="text-bold" style="fill: #c53030; font-size: 10px;">capture_paused = 1</text>
  </g>
  
  <!-- Snapshot thread clears sticky capture_paused -->
  <path d="M 460,250 L 450,250 L 450,330" class="arrow-dashed" marker-end="url(#arrow)" />

</svg>